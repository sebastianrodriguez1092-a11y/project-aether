name: Project Aether QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript and game features
        run: node scripts/validate-aether.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node scripts/browser-smoke.mjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-aether-browser-smoke
          path: project-aether-smoke.png
          if-no-files-found: ignore
