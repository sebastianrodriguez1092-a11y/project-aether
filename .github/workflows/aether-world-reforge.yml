name: Reforge Aether World
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reforge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply world reforge
        run: python .github/scripts/reforge_world.py
      - name: Commit world reforge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_AETHER_MOBILE_V004_RACES_CLASSES.html
          git diff --cached --quiet && exit 0
          git commit -m 'Reforge Aether world geometry and environmental depth'
          git push
