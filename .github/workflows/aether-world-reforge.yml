name: Reforge Aether World
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reforge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate world reforge
        run: node --check aether-world-reforge.js
      - name: Validate world art pass
        run: node --check aether-world-art-pass.js
      - name: Validate bridge
        run: node --check aether-character-bridge.js
